[package]
name = "verifier-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Nexus worker hosting a temporal-proxy tool-call verifier"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
temporalio-client = "~1.0.0"
# vendored-protox compiles Temporal's protos without a system `protoc`.
temporalio-common = { version = "~1.0.0", features = ["vendored-protox"] }
temporalio-sdk-core = "~0.9.0"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
