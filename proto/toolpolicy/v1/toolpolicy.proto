syntax = "proto3";

// Contract between temporal-proxy and an operator-provided tool-call verifier
// Nexus operation (TEMPORAL_PROXY_TOOL_VERIFIER=nexus).
//
// The proxy enforces the local rules itself: activities on the workflow's own
// task queue are allowed, and child workflows / continue-as-new must stay on
// that queue (and namespace). Work that leaves the worker's task queue is
// expressed as tool calls and judged by the verifier:
//
//   - ScheduleNexusOperation         -> name "<endpoint>/<service>/<operation>",
//                                       parameters: the input (zero or one)
//   - ScheduleActivityTask on another task queue
//                                    -> name "<taskQueue>/<activityType>",
//                                       parameters: one per input argument
//
// Activities on the workflow's own task queue and RequestCancelNexusOperation
// are not tool calls.
//
// Each input payload becomes one parameter, typed where possible:
//
//   - json/protobuf with messageType M: an Any of type M (its JSON fields).
//   - binary/protobuf of a type the proxy knows (Temporal API and well-known
//     types): an Any of that type.
//   - binary/protobuf of any other type: the proxy rejects the workflow task,
//     since it cannot render the parameter for verification. Send such inputs
//     as json/protobuf instead.
//   - json/plain: google.protobuf.Value; binary/plain: google.protobuf.BytesValue;
//     binary/null: a null google.protobuf.Value.
//   - anything else (e.g. encrypted payloads): the packed
//     temporal.api.common.v1.Payload.
//
// The proxy sends VerifyToolCallsRequest as a "json/protobuf" payload, so a
// verifier decoding it with a protobuf JSON decoder must be able to resolve the
// parameter types it receives (or treat parameters as plain JSON). The
// operation must return VerifyToolCallsResponse as a "json/protobuf" or
// "binary/protobuf" payload (plain JSON in the protobuf JSON mapping also
// works).
package temporal_untrusted_workers.toolpolicy.v1;

import "google/protobuf/any.proto";

option go_package = "github.com/02strich/temporal-untrusted-workers/gen/toolpolicy/v1;toolpolicypb";

// VerifyToolCallsRequest carries the tool calls of one workflow task
// completion (RespondWorkflowTaskCompleted).
message VerifyToolCallsRequest {
  // The workflow making the tool calls.
  Caller caller = 1;
  // The tool calls, in command order.
  repeated ToolCall tool_calls = 2;
}

// Caller identifies who makes the tool calls: the workflow whose task is being
// completed, and the worker identity completing it.
message Caller {
  // The namespace of the workflow (the identity is pinned to it).
  string namespace = 1;
  // Optional label of the worker identity, for logging.
  string subject = 2;
  // The task queue that issued the workflow task token being completed.
  string task_queue = 3;
  // The ID of the workflow whose task is being completed.
  string workflow_id = 4;
}

// ToolCall is one call that leaves the worker's own task queue.
message ToolCall {
  // "<endpoint>/<service>/<operation>" for Nexus operations,
  // "<taskQueue>/<activityType>" for activities on another task queue.
  string name = 1;
  // The call's inputs, one per input payload.
  repeated google.protobuf.Any parameters = 2;
}

// VerifyToolCallsResponse is the verifier's decision on all tool calls of
// the request. The zero value denies.
message VerifyToolCallsResponse {
  // Was `bool allowed`; reserved so an old verifier's answer is never misread.
  reserved 1;
  reserved "allowed";

  // The decision. Anything other than DECISION_APPROVED rejects the workflow
  // task; the worker retries it on the task's normal timeout.
  Decision decision = 3;
  // Why the tool calls were not approved; returned to the worker.
  string reason = 2;
}

// Decision is a verifier's verdict on a request's tool calls.
enum Decision {
  // No decision; treated as DECISION_DENIED (fail closed). Unknown future
  // values are treated the same way.
  DECISION_UNSPECIFIED = 0;
  // The tool calls may be forwarded upstream.
  DECISION_APPROVED = 1;
  // The tool calls are not allowed. The proxy rejects the workflow task with
  // PermissionDenied.
  DECISION_DENIED = 2;
  // The tool calls need a human's approval. The proxy currently treats this
  // like DECISION_DENIED, with a "pending human review" reason; approving
  // escalated calls is up to the verifier (e.g. answering DECISION_APPROVED
  // on a later attempt).
  DECISION_ESCALATE = 3;
  // The verifier can't decide right now (rate limit, a dependency is down).
  // The proxy rejects the workflow task with Unavailable, as if the verifier
  // were unreachable.
  DECISION_RETRY_LATER = 4;
}
